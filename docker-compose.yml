services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ./ollama_data:/root/.ollama
      - .:/app
    ports:
      - "127.0.0.1:11434:11434"
    dns:
      - 1.1.1.1
      - 9.9.9.9
    restart: unless-stopped

  sinj-bot:
    build: .
    container_name: sinj-discord-bot
    network_mode: host
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - OLLAMA_URL=http://127.0.0.1:11434/api/generate
    restart: unless-stopped

volumes:
  ollama_data:
